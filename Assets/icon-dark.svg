      <stop offset=".74" stop-color="#aebccb" stop-opacity=".30"/>
      <stop offset="1" stop-color="#69788a" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2=".85" y2="1">
