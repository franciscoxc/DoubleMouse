      <g clip-path="url(#cA)"><path d="M0 0 L0 22.6 L5.7 17.4 L9.2 25.3 L12.9 23.7 L9.3 15.9 L16.3 15.9 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/></g>
